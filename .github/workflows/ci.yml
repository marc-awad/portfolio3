name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate markup
        run: npx --yes html-validate@9 index.html fr.html 404.html

  links:
    name: Check links & assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --base resolves root-absolute paths (/assets, /manifest.json…)
          # against the repo root. LinkedIn and Formspree are excluded:
          # they reject bot GETs (999 / POST-only) and would flap the build.
          args: >-
            --no-progress
            --base .
            --exclude linkedin.com
            --exclude formspree.io
            --accept 200,206,301,302,403,429
            index.html fr.html 404.html
          fail: true
