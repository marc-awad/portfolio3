<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>404 – Page Not Found | Marc Awad</title>
    <meta name="description"
          content="The page you're looking for doesn't exist. Go back to Marc Awad's portfolio." />
    <meta name="robots"
          content="noindex, follow" />
    <link rel="canonical"
          href="https://marcawad.vercel.app/" />
    <link rel="stylesheet"
          href="assets/css/main.css" />
    <noscript>
        <link rel="stylesheet"
              href="assets/css/noscript.css" />
    </noscript>
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            color: #ffffff;
        }

        .error-container h1 {
            font-size: 6rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.2em;
            border: none;
        }

        .error-container h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .error-container p {
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 500px;
            opacity: 0.8;
        }

            margin: 0.5rem;
        }

<body class="is-preload">

    <!-- BG -->
    <div id="bg"></div>

    <div class="error-container">

        <div>
            <a href="/"

        </div>

    <script src="assets/js/jquery.min.js"></script>
